<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Finance Monitoring Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<!-- BUILD: naikkan ?v= setiap upload file baru agar browser tidak memakai versi lama -->
<link rel="stylesheet" href="css/app.css?v=20261015d">
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

<div id="login" class="login hidden">
  <div class="login-card">
    <div class="brand" style="justify-content:center"><span class="brand-mark"><i></i></span><div style="text-align:left"><b>PBR Finance</b><small>Monitoring</small></div></div>
    <h1 data-i18n="Finance Monitoring Dashboard">Finance Monitoring Dashboard</h1>
    <div id="gsiBox" style="display:flex;flex-direction:column;gap:12px">
      <p data-i18n="Sign in with your registered Google account.">Sign in with your registered Google account.</p>
      <div id="gsiBtn" class="gsi-slot"></div>
    </div>
    <div id="pinBox" class="hidden" style="display:flex;flex-direction:column;gap:10px">
      <p><span data-i18n="Signed in as">Signed in as</span> <b id="gEmail"></b> · <a href="#" id="gSwitch" data-i18n="use another account">use another account</a></p>
      <label for="pin" data-i18n="PIN">PIN</label>
      <input id="pin" type="password" inputmode="numeric" maxlength="12" autocomplete="off">
      <button id="loginBtn" type="button" class="btn primary" data-i18n="Sign in">Sign in</button>
    </div>
    <div id="loginErr" class="login-err" role="alert"></div>
    <div style="display:flex;justify-content:center"><div class="seg lang-seg" role="group" aria-label="Language"><button type="button" data-lang="en" aria-pressed="false">EN</button><button type="button" data-lang="id" aria-pressed="false">ID</button></div></div>
  </div>
</div>

<div id="app" class="app hidden">
  <nav class="side" aria-label="Main navigation" data-i18n="Main navigation" data-i18n-attr="aria-label">
    <div class="brand"><span class="brand-mark"><i></i></span><div><b>PBR Finance</b><small>Monitoring</small></div></div>
    <div id="nav" style="display:flex;flex-direction:column;gap:10px"></div>
    <div class="user">
      <div id="avatar" class="avatar">?</div>
      <div class="user-meta"><b id="userName">—</b><small id="userSub"></small></div>
      <button id="signOut" type="button" class="icon-btn" aria-label="Sign out" title="Sign out" data-i18n="Sign out" data-i18n-attr="title"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg></button>
    </div>
  </nav>
  <div id="scrim" class="scrim"></div>
  <main class="main">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:12px;min-width:0">
        <button id="menuBtn" type="button" class="pill-btn menu-btn" aria-label="Open menu" data-i18n="Open menu" data-i18n-attr="aria-label"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
        <div style="min-width:0"><div id="crumb" class="crumb"></div><h1 id="pageTitle"></h1></div>
      </div>
      <div class="top-actions">
        <span id="fresh" class="fresh hidden"></span>
        <div class="seg lang-seg" role="group" aria-label="Language"><button type="button" data-lang="en" aria-pressed="false">EN</button><button type="button" data-lang="id" aria-pressed="false">ID</button></div>
        <button id="refreshBtn" type="button" class="pill-btn" title="Check the server for newer data" data-i18n="Check the server for newer data" data-i18n-attr="title"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg><span data-i18n="Refresh">Refresh</span></button>
        <button id="themeBtn" type="button" class="pill-btn" aria-label="Switch theme"></button>
      </div>
    </header>
    <div id="view" style="display:flex;flex-direction:column;gap:20px"></div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="js/i18n.js?v=20261015d"></script>
<script src="js/i18n-id.js?v=20261015d"></script>
<script src="js/core.js?v=20261015d"></script>
<script src="js/ui.js?v=20261015d"></script>
<script src="js/shell.js?v=20261015d"></script>
<script src="js/rev.js?v=20261015d"></script>
<script src="js/menu.js?v=20261015d"></script>
<script src="js/cost.js?v=20261015d"></script>
<script src="js/pages/summary.js?v=20261015d"></script>
<script src="js/pages/rev-daily.js?v=20261015d"></script>
<script src="js/pages/rev-outlet.js?v=20261015d"></script>
<script src="js/pages/rev-events.js?v=20261015d"></script>
<script src="js/pages/rev-menu.js?v=20261015d"></script>
<script src="js/pages/cost-summary.js?v=20261015d"></script>
<script src="js/pages/cost-dml.js?v=20261015d"></script>
<script src="js/pages/data-status.js?v=20261015d"></script>
</body>
</html>
